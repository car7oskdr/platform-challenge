name: CI

on:
  pull_request:
    paths:
      - "app/**"
      - "migrations/**"
      - "model/VERSION"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    # k8s/** queda fuera a propósito: el commit-back de update-manifests no debe
    # volver a disparar el workflow.
    paths:
      - "app/**"
      - "migrations/**"
      - "model/VERSION"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"

# Dos ejecuciones simultáneas comprobarían que el tag está libre antes de que
# ninguna publique. En main no se cancela: abortar a mitad de la publicación
# dejaría el registry con un manifiesto incompleto.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Lock coherente con pyproject
        run: uv lock --check

      - name: Ruff (errores)
        run: uv run ruff check .

      - name: Ruff (formato)
        run: uv run ruff format --check .

      - name: Lint del Dockerfile
        uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Un secreto borrado en el último commit sigue en el historial.
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --redact --verbose --no-banner

  build-push:
    needs: [lint, secrets]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image: ${{ steps.version.outputs.image }}
    steps:
      - uses: actions/checkout@v7

      - name: Leer model/VERSION
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < model/VERSION)"
          if [ -z "$VERSION" ]; then
            echo "::error::model/VERSION está vacío"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # GHCR exige minúsculas en el nombre del repositorio.
          echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "Versión: $VERSION"

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Login en GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Un tag que cambia de contenido rompe la trazabilidad.
      - name: El tag no debe existir ya
        if: github.event_name == 'push'
        run: |
          IMAGE="${{ steps.version.outputs.image }}"
          VERSION="${{ steps.version.outputs.version }}"
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION ya existe. Sube model/VERSION antes de publicar."
            exit 1
          fi
          echo "$IMAGE:$VERSION está libre."

      # Una imagen multi-arch no se puede --load, y Trivy necesita algo que
      # inspeccionar antes de publicar.
      - name: Build local para escanear
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: escaneo:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CRITICAL bloquea; el resto informa, para que un CVE sin parche en la
      # imagen base no deje la entrega sin desplegar.
      - name: Trivy — CRITICAL (bloquea)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: escaneo:${{ steps.version.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy — HIGH y MEDIUM (informativo)
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: escaneo:${{ steps.version.outputs.version }}
          severity: HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"
          format: table

      # Los runners son amd64 y el k3d local corre sobre ARM: sin arm64 el pod
      # fallaría con "exec format error".
      - name: Build multi-arch y push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # El escaneo bloqueante solo ve amd64 porque `load` carga una plataforma.
      - name: Trivy — arm64 publicado (informativo)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          docker run --rm aquasec/trivy:0.58.1 image \
            --platform linux/arm64 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed --scanners vuln --exit-code 0 \
            "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"

      - name: Resumen
        if: github.event_name == 'push'
        run: |
          echo "### Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.version.outputs.image }}:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY

  # ArgoCD mira el repositorio, no el registry: sin este commit el cluster no se
  # entera de que hay una versión nueva.
  update-manifests:
    needs: build-push
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      # Ampliado solo aquí: los demás jobs no escriben en el repositorio.
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # La rama y no el SHA: un checkout detached no se puede empujar.
          ref: ${{ github.ref_name }}
          # Historial completo: el rebase del reintento no funciona sobre un
          # clon superficial.
          fetch-depth: 0

      - name: Instalar kustomize
        run: |
          # El runner ya trae kustomize en /usr/local/bin y el instalador se
          # niega a sobrescribirlo. Se instala en un directorio propio, que
          # ademas mantiene la version fijada y no a merced de la imagen del
          # runner.
          curl -sSfL https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh \
            | bash -s 5.4.3 "$RUNNER_TEMP"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/kustomize" version

      - name: Apuntar el manifiesto a la imagen publicada
        working-directory: k8s/base
        run: |
          kustomize edit set image \
            platform-challenge=${{ needs.build-push.outputs.image }}:${{ needs.build-push.outputs.version }}

      - name: Commit-back
        run: |
          if git diff --quiet -- k8s/base/kustomization.yaml; then
            echo "El manifiesto ya apunta a ${{ needs.build-push.outputs.version }}; nada que hacer."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/base/kustomization.yaml
          git commit -m "chore(deploy): despliega ${{ needs.build-push.outputs.version }}

          Imagen: ${{ needs.build-push.outputs.image }}:${{ needs.build-push.outputs.version }}
          Origen: ${{ github.sha }}"

          # Otro push pudo entrar en main mientras se construía la imagen.
          for intento in 1 2 3; do
            if git push; then
              echo "Commit-back publicado en el intento $intento."
              exit 0
            fi
            echo "Push rechazado; rebase sobre origin/${{ github.ref_name }} e intento de nuevo."
            git pull --rebase origin ${{ github.ref_name }}
          done
          echo "::error::No se pudo hacer commit-back tras 3 intentos."
          exit 1

      - name: Resumen
        run: |
          echo "### Manifiesto actualizado" >> $GITHUB_STEP_SUMMARY
          echo "\`k8s/base/kustomization.yaml\` → \`${{ needs.build-push.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "ArgoCD detectará este commit y sincronizará el cluster." >> $GITHUB_STEP_SUMMARY
