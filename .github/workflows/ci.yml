name: CI

on:
  pull_request:
    paths:
      - "app/**"
      - "migrations/**"
      - "model/VERSION"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - "migrations/**"
      - "model/VERSION"
      - "Dockerfile"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/ci.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Instalar dependencias
        run: uv sync --frozen

      - name: Lock coherente con pyproject
        run: uv lock --check

      - name: Ruff (errores)
        run: uv run ruff check .

      - name: Ruff (formato)
        run: uv run ruff format --check .

      - name: Lint del Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: error

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            detect --source=/repo --redact --verbose --no-banner

  build-push:
    needs: [lint, secrets]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Leer model/VERSION
        id: version
        run: |
          # tr elimina el salto de línea final: un tag con \n falla más tarde y
          # de forma confusa, ya dentro del registry.
          VERSION="$(tr -d '[:space:]' < model/VERSION)"
          if [ -z "$VERSION" ]; then
            echo "::error::model/VERSION está vacío"; exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # GHCR exige minúsculas en el nombre del repositorio.
          echo "image=${REGISTRY}/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "Versión: $VERSION"

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: El tag no debe existir ya
        if: github.event_name == 'push'
        run: |
          IMAGE="${{ steps.version.outputs.image }}"
          VERSION="${{ steps.version.outputs.version }}"
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::$IMAGE:$VERSION ya existe. Sube model/VERSION antes de publicar."
            exit 1
          fi
          echo "$IMAGE:$VERSION está libre."

      - name: Build local para escanear
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: escaneo:${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — CRITICAL (bloquea)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: escaneo:${{ steps.version.outputs.version }}
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Trivy — HIGH y MEDIUM (informativo)
        if: always()
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: escaneo:${{ steps.version.outputs.version }}
          severity: HIGH,MEDIUM
          ignore-unfixed: true
          exit-code: "0"
          format: table

      - name: Build multi-arch y push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' }}
          tags: |
            ${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}
            ${{ steps.version.outputs.image }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy — arm64 publicado (informativo)
        if: github.event_name == 'push'
        continue-on-error: true
        run: |
          docker run --rm aquasec/trivy:0.58.1 image \
            --platform linux/arm64 \
            --severity CRITICAL,HIGH \
            --ignore-unfixed --scanners vuln --exit-code 0 \
            "${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}"

      - name: Resumen
        if: github.event_name == 'push'
        run: |
          echo "### Imagen publicada" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.version.outputs.image }}:${{ steps.version.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`${{ steps.version.outputs.image }}:sha-${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
